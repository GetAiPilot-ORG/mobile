<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <!-- Saddle Cognac Leather Gradient -->
    <linearGradient id="ls-leather" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a1d0d"/>
      <stop offset="45%" stop-color="#261105"/>
      <stop offset="100%" stop-color="#150702"/>
    </linearGradient>

    <!-- Polished Brass Corner Gradient -->
    <linearGradient id="ls-brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fae6a3"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="65%" stop-color="#8a6818"/>
      <stop offset="85%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#664606"/>
    </linearGradient>

    <!-- Grand Cru Glass Bottle Shading -->
    <linearGradient id="ls-bottle-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0b0305"/>
      <stop offset="25%" stop-color="#2e0b16"/>
      <stop offset="60%" stop-color="#1a050b"/>
      <stop offset="100%" stop-color="#080204"/>
    </linearGradient>

    <!-- Wood Base Gradient -->
    <linearGradient id="ls-wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2b160a"/>
      <stop offset="50%" stop-color="#42220f"/>
      <stop offset="100%" stop-color="#160a03"/>
    </linearGradient>

    <filter id="ls-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- Dark Ambience Environment -->
  <rect width="400" height="500" fill="#0d0703"/>

  <!-- Leather Plaque Body -->
  <g filter="url(#ls-shadow)">
    <!-- Main Leather Card -->
    <rect x="42" y="22" width="316" height="436" rx="22" fill="url(#ls-leather)" stroke="#c29b38" stroke-width="2.5"/>
    <!-- Saddle Stitching Inlay -->
    <rect x="54" y="34" width="292" height="412" rx="15" fill="none" stroke="#ebd28b" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>
  </g>

  <!-- 4 Solid Brass Hardware Corner Brackets (Authentic Hardware) -->
  <!-- Top Left -->
  <path d="M 42 66 L 42 44 C 42 31.85, 51.85 22, 64 22 L 86 22 L 86 36 C 73 37, 65 45, 56 53 L 56 66 Z" fill="url(#ls-brass)" stroke="#5c3807" stroke-width="0.8"/>
  <path d="M 84 34 C 72 35, 64 43, 55 52 L 55 64" stroke="#fae6a3" stroke-width="0.75" opacity="0.7" fill="none"/>
  <circle cx="57" cy="37" r="3.2" fill="#3f2705"/>
  <circle cx="57" cy="37" r="2.7" fill="#d4af37"/>
  <line x1="55" y1="37" x2="59" y2="37" stroke="#3f2705" stroke-width="0.7"/>

  <!-- Top Right -->
  <g transform="translate(400, 0) scale(-1, 1)">
    <path d="M 42 66 L 42 44 C 42 31.85, 51.85 22, 64 22 L 86 22 L 86 36 C 73 37, 65 45, 56 53 L 56 66 Z" fill="url(#ls-brass)" stroke="#5c3807" stroke-width="0.8"/>
    <path d="M 84 34 C 72 35, 64 43, 55 52 L 55 64" stroke="#fae6a3" stroke-width="0.75" opacity="0.7" fill="none"/>
    <circle cx="57" cy="37" r="3.2" fill="#3f2705"/>
    <circle cx="57" cy="37" r="2.7" fill="#d4af37"/>
    <line x1="55" y1="37" x2="59" y2="37" stroke="#3f2705" stroke-width="0.7"/>
  </g>

  <!-- Bottom Left -->
  <g transform="translate(0, 480) scale(1, -1)">
    <path d="M 42 66 L 42 44 C 42 31.85, 51.85 22, 64 22 L 86 22 L 86 36 C 73 37, 65 45, 56 53 L 56 66 Z" fill="url(#ls-brass)" stroke="#5c3807" stroke-width="0.8"/>
    <path d="M 84 34 C 72 35, 64 43, 55 52 L 55 64" stroke="#fae6a3" stroke-width="0.75" opacity="0.7" fill="none"/>
    <circle cx="57" cy="37" r="3.2" fill="#3f2705"/>
    <circle cx="57" cy="37" r="2.7" fill="#d4af37"/>
    <line x1="55" y1="37" x2="59" y2="37" stroke="#3f2705" stroke-width="0.7"/>
  </g>

  <!-- Bottom Right -->
  <g transform="translate(400, 480) scale(-1, -1)">
    <path d="M 42 66 L 42 44 C 42 31.85, 51.85 22, 64 22 L 86 22 L 86 36 C 73 37, 65 45, 56 53 L 56 66 Z" fill="url(#ls-brass)" stroke="#5c3807" stroke-width="0.8"/>
    <path d="M 84 34 C 72 35, 64 43, 55 52 L 55 64" stroke="#fae6a3" stroke-width="0.75" opacity="0.7" fill="none"/>
    <circle cx="57" cy="37" r="3.2" fill="#3f2705"/>
    <circle cx="57" cy="37" r="2.7" fill="#d4af37"/>
    <line x1="55" y1="37" x2="59" y2="37" stroke="#3f2705" stroke-width="0.7"/>
  </g>

  <!-- Realistic Grand Cru Wine Bottle + Stemmed Crystal Wine Glass -->
  <g transform="translate(182, 64)">
    <!-- Bottle Shadow -->
    <ellipse cx="0" cy="46" rx="14" ry="2" fill="#000" opacity="0.4"/>
    <ellipse cx="32" cy="46" rx="9" ry="1.5" fill="#000" opacity="0.3"/>
    
    <!-- Heavy Glass Bottle Silhouette -->
    <path d="M -4 -22 L -4 -14 C -4 -6, -12 -2, -12 6 L -12 42 C -12 45, -10 46, -7 46 L 7 46 C 10 46, 12 45, 12 42 L 12 6 C 12 -2, 4 -6, 4 -14 L 4 -22 Z" fill="url(#ls-bottle-glass)" stroke="#c29b38" stroke-width="0.7" stroke-opacity="0.6"/>
    
    <!-- Concave Punt Base -->
    <path d="M -8 46 Q 0 42.5 8 46" stroke="#ffffff" stroke-width="0.75" opacity="0.35" fill="none"/>

    <!-- Specular Left Edge Glass Reflection -->
    <path d="M -10 4 C -10 -2, -5 -8, -3 -14 L -3 -30" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.38"/>
    <line x1="-10" y1="6" x2="-10" y2="40" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.25"/>

    <!-- Gold Foil Neck Capsule -->
    <path d="M -4 -42 L 4 -42 L 4 -22 C 4 -21, -4 -21, -4 -22 Z" fill="url(#ls-brass)"/>
    <rect x="-5" y="-42" width="10" height="3" rx="0.5" fill="url(#ls-brass)" stroke="#664606" stroke-width="0.5"/>
    <line x1="-4" y1="-33" x2="4" y2="-33" stroke="#ffffff" stroke-width="0.8" opacity="0.5"/>
    <rect x="-4.5" y="-24" width="9" height="3" rx="0.5" fill="url(#ls-brass)" stroke="#664606" stroke-width="0.5"/>

    <!-- Authentic Vintage Parchment Wine Label -->
    <rect x="-9" y="4" width="18" height="30" rx="1.5" fill="#fffbf2" stroke="#b45309" stroke-width="0.6"/>
    <rect x="-7.5" y="5.5" width="15" height="27" rx="1" fill="none" stroke="#ca8a04" stroke-width="0.4" stroke-dasharray="1.5,1"/>
    
    <circle cx="0" cy="11" r="2.5" fill="#ca8a04"/>
    <text x="0" y="20" fill="#1c1917" font-family="Georgia, serif" font-size="3" font-weight="900" text-anchor="middle" letter-spacing="0.3">RESERVE</text>
    <text x="0" y="24" fill="#78350f" font-family="Georgia, serif" font-size="2.5" font-weight="700" text-anchor="middle">2018</text>

    <!-- Stemmed Crystal Burgundy Wine Glass with Ruby Red Wine -->
    <g transform="translate(32, 12)">
      <ellipse cx="0" cy="34" rx="8" ry="1.8" fill="none" stroke="#fae6a3" stroke-width="0.8" opacity="0.8"/>
      <line x1="0" y1="18" x2="0" y2="34" stroke="#fae6a3" stroke-width="1" stroke-linecap="round" opacity="0.85"/>
      <path d="M -8 2 C -8 16, 8 16, 8 2 Z" fill="none" stroke="#fae6a3" stroke-width="0.8" opacity="0.8"/>
      <path d="M -7 5 C -7 14, 7 14, 7 5 Z" fill="#991b1b" stroke="#f43f5e" stroke-width="0.4"/>
      <ellipse cx="0" cy="5" rx="7" ry="1.5" fill="#b91c1c"/>
      <path d="M -6 4 C -6 10, -4 12, -3 13" stroke="#fff" stroke-width="0.7" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <!-- Table Number & Station Tag -->
  <text x="200" y="122" fill="#fae6a3" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" letter-spacing="2">TABLE 14 • SOMMELIER SERVICE</text>

  <!-- Restaurant Title & Sommelier Concept -->
  <text x="200" y="140" fill="#fff8f0" font-family="Georgia, serif" font-size="14.5" font-weight="900" text-anchor="middle" letter-spacing="3">LE CELLIER VINTAGE</text>
  <text x="200" y="153" fill="#e8d2be" font-family="system-ui, sans-serif" font-size="8" font-weight="600" text-anchor="middle" letter-spacing="1">GRAND CRU WINE &amp; TASTING ROOM</text>

  <!-- Vintage Cellar Rating Badge -->
  <g transform="translate(200, 164)">
    <rect x="-75" y="-8.5" width="150" height="17" rx="8.5" fill="#4a220c" stroke="#c29b38" stroke-width="1"/>
    <circle cx="-62" cy="0" r="3" fill="#c29b38"/>
    <text x="5" y="3" fill="#fae6a3" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="1.5">96 PTS // CELLAR SELECTION</text>
  </g>

  <!-- Sommelier Vintage Spec Row (3 Columns) -->
  <g transform="translate(68, 178)">
    <rect x="0" y="0" width="264" height="18" rx="6" fill="#000" fill-opacity="0.5" stroke="#c29b38" stroke-width="0.8"/>
    <text x="44" y="8" fill="#a1a1aa" font-family="monospace" font-size="5.5" font-weight="700" text-anchor="middle">VINTAGE</text>
    <text x="44" y="15" fill="#fae6a3" font-family="system-ui, sans-serif" font-size="6.8" font-weight="800" text-anchor="middle">2018</text>
    
    <line x1="88" y1="2" x2="88" y2="16" stroke="#c29b38" stroke-width="0.5" opacity="0.4"/>
    <text x="132" y="8" fill="#a1a1aa" font-family="monospace" font-size="5.5" font-weight="700" text-anchor="middle">VARIETAL</text>
    <text x="132" y="15" fill="#fae6a3" font-family="system-ui, sans-serif" font-size="6.8" font-weight="800" text-anchor="middle">CABERNET</text>

    <line x1="176" y1="2" x2="176" y2="16" stroke="#c29b38" stroke-width="0.5" opacity="0.4"/>
    <text x="220" y="8" fill="#a1a1aa" font-family="monospace" font-size="5.5" font-weight="700" text-anchor="middle">CELLAR</text>
    <text x="220" y="15" fill="#34d399" font-family="system-ui, sans-serif" font-size="6.8" font-weight="800" text-anchor="middle">EST. RESERVE</text>
  </g>

  <!-- Pairing Notes Pill -->
  <rect x="58" y="202" width="284" height="18" rx="9" fill="#180802" stroke="#c29b38" stroke-width="0.8" opacity="0.9"/>
  <text x="200" y="214" fill="#fae6a3" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Oak Barrel Reserve • Aged 24 Months in French Allier</text>

  <!-- Scannable High-Contrast QR Code Unit with Gold Filigree Corners -->
  <g>
    <!-- Gilded Gold Filigree Corner Brackets -->
    <path d="M 112 238 L 112 226 L 124 226" stroke="#fae6a3" stroke-width="2" fill="none"/>
    <path d="M 288 238 L 288 226 L 276 226" stroke="#fae6a3" stroke-width="2" fill="none"/>
    <path d="M 112 374 L 112 386 L 124 386" stroke="#fae6a3" stroke-width="2" fill="none"/>
    <path d="M 288 374 L 288 386 L 276 386" stroke="#fae6a3" stroke-width="2" fill="none"/>

    <!-- Ivory Linen Backing -->
    <rect x="120" y="226" width="160" height="160" rx="18" fill="#fffbf7" stroke="#c29b38" stroke-width="2.5" filter="url(#ls-shadow)"/>
    <rect x="126" y="232" width="148" height="148" rx="14" fill="none" stroke="#ebd28b" stroke-width="0.8"/>

    <!-- Simulated QR Finder Patterns (Deep Espresso Tone) -->
    <rect x="136" y="242" width="30" height="30" fill="#240e04" rx="5"/>
    <rect x="140" y="246" width="22" height="22" fill="#fffbf7" rx="3"/>
    <rect x="144" y="250" width="14" height="14" fill="#240e04" rx="2"/>

    <rect x="234" y="242" width="30" height="30" fill="#240e04" rx="5"/>
    <rect x="238" y="246" width="22" height="22" fill="#fffbf7" rx="3"/>
    <rect x="242" y="250" width="14" height="14" fill="#240e04" rx="2"/>

    <rect x="136" y="340" width="30" height="30" fill="#240e04" rx="5"/>
    <rect x="140" y="344" width="22" height="22" fill="#fffbf7" rx="3"/>
    <rect x="144" y="348" width="14" height="14" fill="#240e04" rx="2"/>

    <!-- Fine Matrix Elements -->
    <rect x="180" y="244" width="6" height="16" fill="#240e04" rx="1"/>
    <rect x="194" y="248" width="16" height="6" fill="#240e04" rx="1"/>
    <rect x="174" y="268" width="10" height="10" fill="#240e04" rx="1"/>
    <rect x="216" y="268" width="8" height="8" fill="#240e04" rx="1"/>
    <rect x="190" y="332" width="14" height="6" fill="#240e04" rx="1"/>
    <rect x="220" y="324" width="8" height="16" fill="#240e04" rx="1"/>
    <rect x="242" y="300" width="16" height="6" fill="#240e04" rx="1"/>
    <rect x="142" y="300" width="12" height="6" fill="#240e04" rx="1"/>

    <!-- Center Logo Badge -->
    <circle cx="200" cy="306" r="17" fill="#c29b38" stroke="#fffbf7" stroke-width="2.5"/>
    <circle cx="200" cy="306" r="13" fill="#240e04"/>
    <text x="200" y="311" fill="#fae6a3" font-family="system-ui, sans-serif" font-size="12" font-weight="900" text-anchor="middle">@</text>
  </g>

  <!-- CTA Banner -->
  <text x="200" y="404" fill="#fae6a3" font-family="Georgia, serif" font-size="10" font-weight="900" text-anchor="middle" letter-spacing="1.5">SCAN FOR SOMMELIER RESERVE WINE LIST</text>
  <text x="200" y="416" fill="#e8d2be" font-family="system-ui, sans-serif" font-size="7.5" font-weight="500" text-anchor="middle">Curated vintage pairings &amp; table-side contactless pay</text>

  <!-- Footer Ribbon -->
  <line x1="60" y1="428" x2="340" y2="428" stroke="#c29b38" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5"/>
  <text x="70" y="440" fill="#fae6a3" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800">★ TABLE-SIDE SERVICE</text>
  <text x="330" y="440" fill="#34d399" font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" text-anchor="end">CONTACTLESS PAY</text>

  <!-- Solid Mahogany Base with Dual Brass Screw Posts -->
  <rect x="110" y="464" width="180" height="16" rx="4" fill="url(#ls-wood)" stroke="#c29b38" stroke-width="1"/>
  <circle cx="130" cy="472" r="3" fill="url(#ls-brass)" stroke="#452705" stroke-width="0.6"/>
  <circle cx="270" cy="472" r="3" fill="url(#ls-brass)" stroke="#452705" stroke-width="0.6"/>
  <ellipse cx="200" cy="482" rx="100" ry="6" fill="#000" opacity="0.45"/>
</svg>