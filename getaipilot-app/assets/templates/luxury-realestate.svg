<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lre-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1d22"/>
      <stop offset="50%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
    <linearGradient id="lre-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="lre-bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="lre-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Environment -->
  <rect width="400" height="500" fill="#0b0f17"/>

  <!-- Plaque Main Body -->
  <g filter="url(#lre-shadow)">
    <rect x="40" y="25" width="320" height="430" rx="20" fill="url(#lre-bg)" stroke="#d97706" stroke-width="2"/>
    <rect x="48" y="33" width="304" height="414" rx="14" fill="none" stroke="#d97706" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.4"/>
  </g>

  <!-- 4 Brass Standoff Bolts -->
  <circle cx="56" cy="41" r="5" fill="url(#lre-bolt)" stroke="#451a03" stroke-width="0.5"/>
  <circle cx="344" cy="41" r="5" fill="url(#lre-bolt)" stroke="#451a03" stroke-width="0.5"/>
  <circle cx="56" cy="439" r="5" fill="url(#lre-bolt)" stroke="#451a03" stroke-width="0.5"/>
  <circle cx="344" cy="439" r="5" fill="url(#lre-bolt)" stroke="#451a03" stroke-width="0.5"/>

  <!-- Header Text & Badge -->
  <text x="70" y="58" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10" font-weight="800" letter-spacing="2">LUXURY ESTATES</text>
  <rect x="238" y="47" width="102" height="16" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="289" y="58" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="1">EXCLUSIVE LISTING</text>

  <!-- Architectural Villa Banner -->
  <g>
    <rect x="60" y="70" width="280" height="85" rx="10" fill="#060c18" stroke="#d97706" stroke-width="0.8"/>
    <rect x="75" y="88" width="110" height="40" fill="#1e293b" stroke="#f59e0b" stroke-width="0.6"/>
    <rect x="85" y="94" width="35" height="24" fill="#38bdf8" opacity="0.3"/>
    <rect x="125" y="94" width="50" height="24" fill="#fde047" opacity="0.25"/>
    <rect x="175" y="78" width="90" height="35" fill="#0f172a" stroke="#d97706" stroke-width="0.6"/>
    <!-- Pool Reflection -->
    <rect x="68" y="132" width="264" height="16" rx="3" fill="#0284c7" opacity="0.4"/>
    <!-- Badge -->
    <rect x="68" y="76" width="130" height="14" rx="4" fill="#f59e0b"/>
    <text x="133" y="86" fill="#000" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle">360° 3D VIRTUAL TOUR</text>
    <text x="325" y="86" fill="#fde047" font-family="system-ui, sans-serif" font-size="8" font-weight="900" text-anchor="end">$4,850,000</text>
  </g>

  <!-- Title & Location -->
  <text x="200" y="174" fill="#ffffff" font-family="Georgia, serif" font-size="14" font-weight="900" text-anchor="middle" letter-spacing="2">VILLA SERENA • RESIDENCES</text>
  <text x="200" y="188" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle" opacity="0.8">Palm Jumeirah • Dubai, UAE</text>

  <!-- 4 Spec Pills -->
  <g font-family="system-ui, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle">
    <rect x="60" y="196" width="65" height="20" rx="5" fill="#1f1a12" stroke="#d97706" stroke-width="0.6"/>
    <text x="92" y="209" fill="#fde68a">🛏️ 5 BEDS</text>

    <rect x="131" y="196" width="65" height="20" rx="5" fill="#1f1a12" stroke="#d97706" stroke-width="0.6"/>
    <text x="163" y="209" fill="#fde68a">🛁 6 BATHS</text>

    <rect x="202" y="196" width="65" height="20" rx="5" fill="#1f1a12" stroke="#d97706" stroke-width="0.6"/>
    <text x="234" y="209" fill="#fde68a">📐 7,850 SQFT</text>

    <rect x="273" y="196" width="67" height="20" rx="5" fill="#1f1a12" stroke="#d97706" stroke-width="0.6"/>
    <text x="306" y="209" fill="#fde68a">🌊 BEACH</text>
  </g>

  <!-- QR Code Frame & Matrix Representation -->
  <g>
    <!-- Corner Brackets -->
    <path d="M 125 230 L 115 230 L 115 240" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 275 230 L 285 230 L 285 240" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 125 350 L 115 350 L 115 340" stroke="#f59e0b" stroke-width="2" fill="none"/>
    <path d="M 275 350 L 285 350 L 285 340" stroke="#f59e0b" stroke-width="2" fill="none"/>

    <rect x="125" y="230" width="150" height="120" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Simulated QR Finder Patterns -->
    <rect x="135" y="240" width="28" height="28" fill="#1e1b18" rx="4"/>
    <rect x="139" y="244" width="20" height="20" fill="#fff" rx="2"/>
    <rect x="143" y="248" width="12" height="12" fill="#1e1b18" rx="1"/>

    <rect x="237" y="240" width="28" height="28" fill="#1e1b18" rx="4"/>
    <rect x="241" y="244" width="20" height="20" fill="#fff" rx="2"/>
    <rect x="245" y="248" width="12" height="12" fill="#1e1b18" rx="1"/>

    <rect x="135" y="312" width="28" height="28" fill="#1e1b18" rx="4"/>
    <rect x="139" y="316" width="20" height="20" fill="#fff" rx="2"/>
    <rect x="143" y="320" width="12" height="12" fill="#1e1b18" rx="1"/>

    <!-- Center Logo Badge -->
    <circle cx="200" cy="290" r="16" fill="#f59e0b" stroke="#fff" stroke-width="2"/>
    <text x="200" y="295" fill="#fff" font-family="system-ui, sans-serif" font-size="14" font-weight="900" text-anchor="middle">G</text>
  </g>

  <!-- CTA -->
  <text x="200" y="372" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle" letter-spacing="1">SCAN FOR 3D VIRTUAL WALKTHROUGH</text>
  <text x="200" y="384" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">Interactive Floorplans, Drone Video & Booking</text>

  <!-- Agent Footer -->
  <line x1="60" y1="398" x2="340" y2="398" stroke="#451a03" stroke-width="1"/>
  <circle cx="75" cy="418" r="11" fill="#f59e0b"/>
  <text x="75" y="422" fill="#000" font-family="system-ui, sans-serif" font-size="9" font-weight="900" text-anchor="middle">MV</text>
  <text x="94" y="416" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800">Marcus Vance | Global Realty</text>
  <text x="94" y="426" fill="#fde68a" font-family="system-ui, sans-serif" font-size="7.5" font-weight="600">+971 50 123 4567</text>

  <rect x="250" y="409" width="90" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8"/>
  <text x="295" y="421" fill="#34d399" font-family="system-ui, sans-serif" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="1">VERIFIED BROKER</text>

  <!-- Easel Base -->
  <polygon points="120,455 280,455 290,465 110,465" fill="url(#lre-gold)"/>
</svg>
